name: pinspiration
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.1.1
  flutter_staggered_grid_view: ^0.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Klavika
      fonts:
        - asset: assets/fonts/KlavikaBoldBold.otf
    - family: Frutiger
      fonts:
        - asset: assets/fonts/FrutigerLTStd-Roman.otf
    - family: MatchaMint
      fonts:
        - asset: assets/fonts/MatchaMint.otf
    - family: CreamyChicken
      fonts:
        - asset: assets/fonts/CreamyChicken.otf


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"